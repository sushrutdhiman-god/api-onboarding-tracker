spring:
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://localhost:5432/onboarding_db
    username: onboarding_user
    password: onboarding_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/onboarding

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG